name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DART_SUPPRESS_ANALYTICS: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # Public standard runners have free minutes. A future private repository
    # requires explicit allowance/billing verification before runs are enabled.
    if: github.event.repository.private == false || vars.ZERO_SPEND_CI_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: false
      - name: Automated, business, UI acceptance, 10000 generated levels
        run: bash tool/quality_gate.sh
      - name: Test exact-commit TestFlight gate
        run: python3 -m unittest discover -s tool/tests -v
      - name: Diagnose formatting after a failed gate
        if: failure()
        run: |
          dart format lib test integration_test tool test_driver
          git diff
      - name: Print executed test result
        if: always()
        run: |
          if [ -f test-results/flutter.json ]; then cat test-results/flutter.json; fi
      - name: Print source identity
        if: always()
        run: |
          if [ -f test-results/source-identity.json ]; then cat test-results/source-identity.json; fi
      - name: Compile portable candidate
        run: flutter build web --release --no-pub
      - name: Publish checks to run summary without paid artifact storage
        if: always()
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('Bus Jam: all automated and iOS simulator tests run in Actions. Codemagic builds and uploads TestFlight.\n\n')
            p=Path('docs/evidence/generator.json')
            if p.exists(): f.write('```json\n'+p.read_text()+'\n```\n')
            p=Path('test-results/flutter.json')
            if p.exists():
              events=[json.loads(x) for x in p.read_text().splitlines() if x.startswith('{')]
              result=next((e for e in reversed(events) if e.get('type')=='done'),None)
              f.write('Flutter result: '+json.dumps(result)+'\n')
          PY
  ios_uat:
    name: iOS simulator acceptance
    needs: quality
    if: github.event.repository.private == false || vars.ZERO_SPEND_CI_READY == 'true'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          architecture: arm64
          cache: false
      - name: Native dependencies and environment
        run: |
          flutter pub get --enforce-lockfile
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Native iPhone journeys and screenshots
        timeout-minutes: 30
        run: bash tool/run_ios_uat.sh
      - name: Compile normal simulator app
        timeout-minutes: 10
        run: python3 -u tool/run_with_timeout.py 540 flutter build ios --simulator --debug --no-pub
      - name: Native previews for visual inspection
        if: always()
        run: python3 tool/print_ios_previews.py
      - name: Bound evidence size
        id: evidence_bound
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          size=sum(p.stat().st_size for p in Path('test-results').rglob('*') if p.is_file())
          print('Native evidence bytes:',size)
          assert size <= 16*1024*1024, 'Evidence exceeds the 16 MiB storage bound'
          PY
      - name: Preserve native evidence for one day
        if: always() && steps.evidence_bound.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence-${{ github.sha }}
          path: test-results/
          retention-days: 1
          if-no-files-found: error
      - name: Native result in run summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('iPhone simulator UAT. Real StoreKit/AdMob sandbox checks are separate and are never inferred.\n\n')
            for name in ['ios-source-identity.json','ios-uat.json']:
              p=Path('test-results')/name
              if p.exists(): f.write('### '+name+'\n\n```json\n'+p.read_text()+'\n```\n')
          PY

