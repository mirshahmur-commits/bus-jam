name: bus_jam
description: A colorful offline queue puzzle from SystemCraft Games.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  google_mobile_ads: ^6.0.0
  audioplayers: ^6.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  # google_mobile_ads 6 uses CocoaPods and depends on a WebView plugin that also
  # supports SwiftPM. Keep this pinned dependency graph on one native resolver.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/art/urban/
    - assets/branding/wordmark.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
