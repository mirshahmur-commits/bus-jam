# Manual internal TestFlight build; all tests execute in GitHub Actions.
workflows:
  ios-testflight:
    name: Bus Surge TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: MiniPoliglotKey
    environment:
      groups:
        - bus_jam_build
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.systemcraft.busJam
    scripts:
      - name: Confirm free allowance and successful Actions for this commit
        script: |
          set -euo pipefail
          if [[ "${ZERO_SPEND_CI_READY:-false}" != "true" ]]; then
            printf '%s\n' \
              'Build blocked: ZERO_SPEND_CI_READY must be true.' \
              'After verifying free allowance and blocked paid overage, add it in Codemagic App settings > Environment variables, group bus_jam_build.' >&2
            exit 1
          fi
          python3 tool/verify_actions.py
      - name: Build dependencies
        script: flutter pub get --enforce-lockfile
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Signed IPA for internal TestFlight
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define="ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID:-}" \
            --dart-define="ADMOB_INTERSTITIAL_ID=${ADMOB_INTERSTITIAL_ID:-}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
