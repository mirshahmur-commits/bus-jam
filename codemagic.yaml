# Manual internal TestFlight build; all tests execute in GitHub Actions.
workflows:
  ios-testflight:
    name: Bus Surge TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: MiniPoliglotKey
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.systemcraft.busJam
    scripts:
      - name: Build dependencies
        script: flutter pub get --enforce-lockfile
      - name: Apply signing profiles
        script: |
          python3 tool/configure_game_center.py
          xcode-project use-profiles
      - name: Signed IPA for internal TestFlight
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub --build-number="$PROJECT_BUILD_NUMBER" \
            --dart-define="ADMOB_REWARDED_ID=${ADMOB_REWARDED_ID:-}" \
            --dart-define="ADMOB_INTERSTITIAL_ID=${ADMOB_INTERSTITIAL_ID:-}" \
            --dart-define="GAME_CENTER_LEADERBOARD_ID=${GAME_CENTER_LEADERBOARD_ID:-}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
